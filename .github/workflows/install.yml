name: Install and test frontend

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        shell: powershell
        run: |
          npm run build 2>&1 | Tee-Object build-output.txt
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt
          if-no-files-found: ignore

      - name: Create ZIP
        if: success()
        shell: powershell
        run: |
          Compress-Archive `
            -Path node_modules `
            -DestinationPath frontend-node_modules.zip `
            -CompressionLevel Optimal

      - name: Upload dependencies
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-node-modules
          path: frontend-node_modules.zip
          retention-days: 1
