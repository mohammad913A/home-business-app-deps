name: Install and test frontend

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path node_modules `
            -DestinationPath frontend-node_modules.zip `
            -CompressionLevel Optimal

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: frontend-node-modules
          path: frontend-node_modules.zip
          retention-days: 1
