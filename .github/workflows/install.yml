name: Build frontend dependencies

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check Vite
        shell: powershell
        run: |
          Write-Host "Checking Vite..."
          if (!(Test-Path "node_modules\vite")) {
            Write-Host "VITE IS MISSING"
            npm list vite --depth=0
            exit 1
          }
          Write-Host "Vite found:"
          Get-ChildItem "node_modules\vite"

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path node_modules,package-lock.json `
            -DestinationPath frontend-deps.zip `
            -CompressionLevel Optimal

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deps
          path: frontend-deps.zip
          retention-days: 7
