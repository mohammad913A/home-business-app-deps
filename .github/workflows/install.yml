name: Build frontend dependencies

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        shell: powershell
        run: |
          npm install --verbose 2>&1 | Tee-Object install-log.txt
          Write-Host "===== INSTALL FINISHED ====="
          if (Test-Path node_modules) {
            Write-Host "node_modules exists"
          }

      - name: Show important packages
        if: always()
        shell: powershell
        run: |
          Write-Host "===== VITE ====="
          if (Test-Path node_modules\vite) {
            Write-Host "VITE FOUND"
          } else {
            Write-Host "VITE MISSING"
          }

          Write-Host "===== REACT ====="
          if (Test-Path node_modules\react) {
            Write-Host "REACT FOUND"
          }

          Write-Host "===== BIN ====="
          Get-ChildItem node_modules\.bin -ErrorAction SilentlyContinue

      - name: Create ZIP
        if: always()
        shell: powershell
        run: |
          if (Test-Path node_modules) {
            Compress-Archive `
              -Path node_modules `
              -DestinationPath frontend-deps.zip `
              -CompressionLevel Optimal
          }

      - name: Upload files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-debug
          path: |
            frontend-deps.zip
            install-log.txt
