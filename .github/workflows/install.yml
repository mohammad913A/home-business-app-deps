name: Build frontend dependencies

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify packages
        shell: powershell
        run: |
          npm list react react-dom vite @mui/material --depth=0
          node -e "console.log('React:', require('./node_modules/react/package.json').version)"
          node -e "console.log('Vite:', require('./node_modules/vite/package.json').version)"

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive -Path node_modules,package-lock.json -DestinationPath frontend-deps.zip -CompressionLevel Optimal

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deps
          path: frontend-deps.zip
          retention-days: 7
